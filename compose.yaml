services:
  flask-app:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    depends_on:
       mysql-db:
          condition: service_healthy  # Ensures MySQL is ready before Flask starts
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DB: ${MYSQL_DB:?Set MYSQL_DB in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
    volumes:
      - .:/app
    networks:
      - app-network
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:?Set MYSQL_DB in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      
volumes:
  mysql_data:

networks:
  app-network: