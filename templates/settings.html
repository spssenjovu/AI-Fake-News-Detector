<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | AI News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="navbar-title">AI Fake News Detector</h1>
            <ul>
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <section class="settings-section">
            <h2>Account Settings</h2>
            <p><strong>Email:</strong> {{ get_decrypted_email() }}</p>
            <div class="button-group">
                <button class="btn">Change Password</button>
                <button class="btn danger">Delete Account</button>
            </div>
        </section>

        <section class="settings-section">
            <h2>Security Preferences</h2>
            <label>
                <input type="checkbox" id="2faToggle">
                Enable Two-Factor Authentication
            </label><br>
            <label>
                <input type="checkbox" id="sessionTimeout">
                Auto-logout after inactivity
            </label>
        </section>

        <section class="settings-section">
            <h2>Model Configuration</h2>
            <label for="confidenceThreshold">Confidence Threshold:</label>
            <input type="range" id="confidenceThreshold" min="0.5" max="0.95" step="0.01" value="0.75">
            <p>Current threshold: <span id="thresholdValue">0.75</span></p>
        </section>

        <div class="button-group">
            <button class="btn primary">Save Changes</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 AI News Detector | Developed by Simon | University of Plymouth</p>
    </footer>

    <script>
        const slider = document.getElementById('confidenceThreshold');
        const output = document.getElementById('thresholdValue');
        slider.addEventListener('input', () => {
            output.textContent = slider.value;
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
